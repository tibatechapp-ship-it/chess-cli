name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-dev.txt
      # Lint runs in the dedicated `lint` job below (deterministic E9+F gate).
      - name: Test
        run: |
          if ls tests/ 2>/dev/null | grep -q . || ls test/ 2>/dev/null | grep -q .; then
            pytest -q; rc=$?; if [ $rc -eq 5 ]; then echo "no tests collected"; exit 0; fi; exit $rc
          else
            echo "no tests directory yet - pass"
          fi
      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

  # The bootstrap test job cannot lint: it only runs ruff when a
  # pyproject/setup.py exists (this repo has neither) and it tolerates
  # failures with "|| true". This job is the real gate: ruff.toml selects
  # E9+F only (undefined names, unused imports, syntax errors) so it is
  # deterministic and adds no style churn.
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip "ruff==0.17.3"
      - name: Ruff (E9+F)
        run: ruff check --config ruff.toml .
