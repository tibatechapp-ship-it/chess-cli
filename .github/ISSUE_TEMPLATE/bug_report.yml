name: "🐛 تقرير علة | Bug report"
description: سلوك غير متوقع أو خطأ
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: ماذا حدث؟ | What happened?
      description: وصف واضح للسلوك الفعلي مقابل المتوقع
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: خطوات إعادة الإنتاج | Steps to reproduce
      placeholder: |
        1. شغّل python main.py (أو python web.py)
        2. أدخل النقلة ...
        3. لاحظ ...
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: الأثر | Impact
      options:
        - "حاد — يمنع اللعب (blocker)"
        - "متوسط — نقلة تُرفض خطأً أو سلوك غريب مع بديل"
        - "بسيط — تجميلي أو نصي"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: أين ظهرت العلة؟ | Surface
      options:
        - "الطرفية (main.py)"
        - "واجهة الويب (web.py)"
        - "الواجهة البرمجية REST (/api/*)"
        - "غير ذلك"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: البيئة | Environment
      description: نظام التشغيل / إصدار بايثون / إصدار المشروع
      placeholder: "مثال: Ubuntu 24.04، Python 3.12، chess-cli 0.1.0"
  - type: textarea
    id: logs
    attributes:
      label: سجلات أو لقطات | Logs or screenshots
      description: "⚠️ لا تُلصق أبداً مفاتيح أو توكنات أو بيانات شخصية"
